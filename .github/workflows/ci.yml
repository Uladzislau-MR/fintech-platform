name: CI

on:
  push:
    branches:
      - feat/docker-and-ci
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: userservice/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: userservice

      - name: Run unit and integration tests
        run: ./gradlew check --no-daemon
        working-directory: userservice

      - name: Build bootJar
        run: ./gradlew bootJar -x test --no-daemon
        working-directory: userservice

      - name: Build Docker image
        run: docker build -t userservice:ci -f Dockerfile .
        working-directory: userservice
