name: CI

on:
  push:
    branches:
      - feat/docker-and-ci
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: userservice/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: userservice

      - name: Run unit and integration tests
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          SPRING_LIQUIBASE_ENABLED: "true"
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"
        run: |
          ./gradlew check --no-daemon --stacktrace || {
            head -n 80 build/test-results/test/TEST-*.xml
            exit 1
          }
        working-directory: userservice

      - name: Build bootJar
        run: ./gradlew bootJar -x test --no-daemon
        working-directory: userservice

      - name: Build Docker image
        run: docker build -t userservice:ci -f Dockerfile .
        working-directory: userservice
