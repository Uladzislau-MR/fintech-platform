name: CI

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история git нужна Sonar для корректного анализа

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: userservice/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: userservice

      - name: Build and run all tests
        run: ./gradlew build --no-daemon
        working-directory: userservice

      - name: Analyze with SonarCloud
        run: ./gradlew sonar --no-daemon
        working-directory: userservice
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t userservice:ci -f Dockerfile .
        working-directory: userservice
